# Faz o L — screen sharing com quase zero de delay
#
# Este arquivo tem só o essencial (LiveKit + app). O HTTPS vem de um destes:
#   docker-compose.caddy.yml    -> VPS limpa: Caddy com Let's Encrypt nas portas 80/443
#   docker-compose.traefik.yml  -> VPS com Coolify/Traefik já ocupando 80/443
# O ./install.sh escolhe sozinho e grava em COMPOSE_FILE no .env,
# então depois é só usar "docker compose up -d --build" normalmente.

services:
  # Servidor de mídia WebRTC (SFU). Recebe as telas e distribui pros espectadores.
  livekit:
    image: livekit/livekit-server:${LIVEKIT_VERSION:-v1.13.11}
    restart: unless-stopped
    ports:
      - "7881:7881/tcp" # fallback WebRTC via TCP
      - "7882:7882/udp" # WebRTC (porta UDP única)
    networks:
      default:
        aliases: [fazol-livekit]
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        logging:
          level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
          node_ip: "${LIVEKIT_NODE_IP:-}"
        keys:
          ${LIVEKIT_API_KEY:?Defina LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Defina LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://fazol-app:3000/api/livekit/webhook
        room:
          empty_timeout: 300

  # Site + API + bot do Discord
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env
    networks:
      default:
        aliases: [fazol-app]
    environment:
      LIVEKIT_HOST: http://fazol-livekit:7880
      PUBLIC_URL: https://${DOMAIN:?Defina DOMAIN no .env}
      RECORDER_URL: http://fazol-recorder:8090
      CLIPS_DIR: /data/clips
      DB_FILE: /data/app/fazol.db
    volumes:
      - clips:/data/clips
      - appdata:/data/app

  # Gravador de clipes: entra nas salas com live e guarda os últimos ~3 min de cada uma (sem recodificar)
  # e gera o clipe quando alguém clica em "Clipar"
  recorder:
    build: ./recorder
    restart: unless-stopped
    networks:
      default:
        aliases: [fazol-recorder]
    environment:
      LIVEKIT_WS_URL: ws://fazol-livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      CLIPS_DIR: /data/clips
      BUFFER_DIR: /data/buffer
    volumes:
      - clips:/data/clips
      - recorder_buffer:/data/buffer
    depends_on:
      - livekit

volumes:
  clips:
  appdata:
  recorder_buffer:
