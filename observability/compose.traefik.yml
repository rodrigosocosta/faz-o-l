# Publicação opcional do painel pelo Traefik/Coolify existente.
# Use: sh observability/stack.sh --traefik up
services:
  fazol-signoz-signoz-0:
    networks:
      traefik: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-coolify}
      - traefik.http.middlewares.fazol-signoz-https.redirectscheme.scheme=https
      - traefik.http.routers.fazol-signoz-http.rule=Host(`${SIGNOZ_DOMAIN:?Defina SIGNOZ_DOMAIN no .env}`)
      - traefik.http.routers.fazol-signoz-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP:-http}
      - traefik.http.routers.fazol-signoz-http.middlewares=fazol-signoz-https
      - traefik.http.routers.fazol-signoz-http.service=fazol-signoz
      - traefik.http.routers.fazol-signoz.rule=Host(`${SIGNOZ_DOMAIN:?Defina SIGNOZ_DOMAIN no .env}`)
      - traefik.http.routers.fazol-signoz.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS:-https}
      - traefik.http.routers.fazol-signoz.tls=true
      - traefik.http.routers.fazol-signoz.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.fazol-signoz.service=fazol-signoz
      - traefik.http.services.fazol-signoz.loadbalancer.server.port=8080

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-coolify}
    external: true
