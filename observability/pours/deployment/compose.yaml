name: fazol-signoz
networks:
  fazol-signoz-network:
    name: fazol-signoz-network
  ingestion:
    internal: true
    name: fazol-observability
services:
  fazol-signoz-metastore-postgres-0:
    container_name: fazol-signoz-metastore-postgres-0
    environment:
    - POSTGRES_DB=signoz
    - POSTGRES_PASSWORD=signoz
    - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    networks:
    - fazol-signoz-network
    restart: unless-stopped
    volumes:
    - fazol-signoz-metastore-postgres-0-data:/var/lib/postgresql/data
  fazol-signoz-signoz-0:
    container_name: fazol-signoz-signoz-0
    depends_on:
      fazol-signoz-metastore-postgres-0:
        condition: service_healthy
      fazol-signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    environment:
    - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@fazol-signoz-metastore-postgres-0:5432/signoz?sslmode=disable
    - SIGNOZ_SQLSTORE_PROVIDER=postgres
    - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:v0.151.0
    networks:
    - fazol-signoz-network
    ports:
    - 127.0.0.1:${SIGNOZ_PORT:-8080}:8080
    restart: unless-stopped
  fazol-signoz-telemetrykeeper-clickhousekeeper-0:
    container_name: fazol-signoz-telemetrykeeper-clickhousekeeper-0
    entrypoint:
    - /usr/bin/clickhouse-keeper
    - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - clickhouse-keeper-client
      - -h
      - localhost
      - -p
      - "9181"
      - -q
      - ls
      timeout: 10s
    image: clickhouse/clickhouse-keeper:25.12.5
    networks:
    - fazol-signoz-network
    restart: unless-stopped
    volumes:
    - fazol-signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
    - ./telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
  fazol-signoz-telemetrystore-clickhouse-0-0:
    container_name: fazol-signoz-telemetrystore-clickhouse-0-0
    depends_on:
      fazol-signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      fazol-signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.12.5
    networks:
    - fazol-signoz-network
    restart: unless-stopped
    volumes:
    - fazol-signoz-telemetrystore-0-0-data:/var/lib/clickhouse
    - fazol-signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
    - ./telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
    - ./telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
  fazol-signoz-telemetrystore-clickhouse-user-scripts:
    command:
    - bash
    - -c
    - |-
      version="v0.0.1"
      node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
      node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
      echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
      cd /tmp
      wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
      tar -xvzf histogram-quantile.tar.gz
      mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    container_name: fazol-signoz-telemetrystore-clickhouse-user-scripts
    image: clickhouse/clickhouse-server:25.12.5
    networks:
    - fazol-signoz-network
    restart: on-failure
    volumes:
    - fazol-signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
  fazol-signoz-telemetrystore-migrator:
    command:
    - -c
    - |
      /signoz-otel-collector migrate ready &&
      /signoz-otel-collector migrate bootstrap &&
      /signoz-otel-collector migrate sync up &&
      /signoz-otel-collector migrate async up
    container_name: fazol-signoz-telemetrystore-migrator
    depends_on:
      fazol-signoz-telemetrystore-clickhouse-0-0:
        condition: service_healthy
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000
    - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-production}
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:v0.144.18
    networks:
    - fazol-signoz-network
    restart: on-failure
  ingester:
    command:
    - -c
    - /signoz-otel-collector migrate sync check && /signoz-otel-collector --config=/etc/otel-collector-config.yaml
    depends_on:
      fazol-signoz-signoz-0:
        condition: service_healthy
    deploy:
      replicas: 1
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000
    - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-production}
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:v0.144.18
    networks:
      fazol-signoz-network:
        aliases:
        - fazol-signoz-ingester
      ingestion:
        aliases:
        - fazol-otel-collector
    restart: unless-stopped
    volumes:
    - ./ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
    - ./ingester/opamp.yaml:/etc/opamp-config.yaml:ro
volumes:
  fazol-signoz-metastore-postgres-0-data:
    name: fazol-signoz-metastore-postgres-0-data
  fazol-signoz-telemetrykeeper-0-data:
    name: fazol-signoz-telemetrykeeper-0-data
  fazol-signoz-telemetrystore-0-0-data:
    name: fazol-signoz-telemetrystore-0-0-data
  fazol-signoz-telemetrystore-user-scripts:
    name: fazol-signoz-telemetrystore-user-scripts
