connectors:
  signozmeter:
    dimensions:
    - name: service.name
    - name: deployment.environment
    - name: host.name
    metrics_flush_interval: 1h
exporters:
  clickhouselogsexporter:
    dsn: tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000/signoz_logs
    sending_queue:
      enabled: false
    timeout: 45s
    use_new_schema: true
  clickhousetraces:
    datasource: tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    sending_queue:
      enabled: false
    timeout: 45s
    use_new_schema: true
  metadataexporter:
    cache:
      provider: in_memory
    dsn: tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000/signoz_metadata
    enabled: true
    timeout: 45s
  signozclickhousemeter:
    dsn: tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000/signoz_meter
    sending_queue:
      enabled: false
    timeout: 45s
  signozclickhousemetrics:
    dsn: tcp://fazol-signoz-telemetrystore-clickhouse-0-0:9000/signoz_metrics
    sending_queue:
      enabled: false
    timeout: 45s
extensions:
  pprof:
    endpoint: 0.0.0.0:1777
  signoz_health_check:
    endpoint: 0.0.0.0:13133
processors:
  batch:
    send_batch_max_size: 1024
    send_batch_size: 512
    timeout: 5s
  batch/meter:
    send_batch_max_size: 25000
    send_batch_size: 20000
    timeout: 5s
  filter/drop_stale:
    error_mode: ignore
    logs:
      log_record:
      - time_unix_nano != 0 and time < Now() - Duration("360h")
      - time_unix_nano == 0 and observed_time_unix_nano != 0 and observed_time < Now()
        - Duration("360h")
    metrics:
      datapoint:
      - time_unix_nano != 0 and time < Now() - Duration("360h")
    traces:
      span:
      - start_time_unix_nano != 0 and start_time < Now() - Duration("360h")
  resource/livekit:
    attributes:
    - action: upsert
      key: service.name
      value: fazol-livekit
    - action: upsert
      key: deployment.environment.name
      value: ${env:OTEL_ENVIRONMENT}
  signozllmpricing:
    attrs:
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
      in: gen_ai.usage.input_tokens
      model: gen_ai.request.model
      out: gen_ai.usage.output_tokens
    default_pricing:
      rules: []
    output_attrs:
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  signozlogsnormalizer: {}
  signozspanmapper:
    groups: []
  signozspanmetrics/delta:
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    dimensions:
    - default: default
      name: service.namespace
    - default: default
      name: deployment.environment
    - name: signoz.collector.id
    - name: service.version
    dimensions_cache_size: 100000
    enable_exp_histogram: true
    latency_histogram_buckets:
    - 100us
    - 1ms
    - 2ms
    - 6ms
    - 10ms
    - 50ms
    - 100ms
    - 250ms
    - 500ms
    - 1000ms
    - 1400ms
    - 2000ms
    - 5s
    - 10s
    - 20s
    - 40s
    - 60s
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus/livekit:
    config:
      scrape_configs:
      - job_name: fazol-livekit
        metric_relabel_configs:
        - action: drop
          regex: .+
          separator: ""
          source_labels:
          - room
          - room_name
          - room_id
          - room_sid
          - participant_id
          - participant_sid
          - participant_identity
          - track_id
          - track_sid
        scrape_interval: 15s
        static_configs:
        - targets:
          - fazol-livekit-metrics:6789
service:
  extensions:
  - signoz_health_check
  - pprof
  pipelines:
    logs:
      exporters:
      - clickhouselogsexporter
      - signozmeter
      - metadataexporter
      processors:
      - signozlogsnormalizer
      - filter/drop_stale
      - batch
      receivers:
      - otlp
    metrics:
      exporters:
      - signozclickhousemetrics
      - signozmeter
      - metadataexporter
      processors:
      - filter/drop_stale
      - batch
      receivers:
      - otlp
    metrics/livekit:
      exporters:
      - signozclickhousemetrics
      - metadataexporter
      processors:
      - resource/livekit
      - batch
      receivers:
      - prometheus/livekit
    metrics/meter:
      exporters:
      - signozclickhousemeter
      processors:
      - batch/meter
      receivers:
      - signozmeter
    traces:
      exporters:
      - clickhousetraces
      - signozmeter
      - metadataexporter
      processors:
      - signozspanmetrics/delta
      - signozspanmapper
      - signozllmpricing
      - filter/drop_stale
      - batch
      receivers:
      - otlp
  telemetry:
    logs:
      encoding: json
