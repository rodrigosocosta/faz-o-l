name: App desktop (Windows)

# Gera o instalador do app desktop num servidor Windows do GitHub.
# - Todo push em main: publica uma Release com a próxima versão patch (vX.Y.Z).
# - Tag de versão (alpha-0.1.0, beta-0.2.0, v1.0.0): publica uma Release com o
#   instalador + latest.json. Os apps instalados olham o latest.json da última
#   Release ao abrir e se atualizam sozinhos.
#
# Versão do app = versão da tag: alpha-0.1.0 -> 0.1.0-alpha, v1.0.0 -> 1.0.0.
#
# Segredos (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   assinam a atualização (gere com "npx tauri signer generate" e ponha a chave
#   pública em plugins.updater.pubkey no tauri.conf.json). Sem a chave privada, a publicação
#   falha para não substituir a latest por uma versão sem atualização automática.
# Variável FAZOL_SERVER_URL: servidor embutido no app (ou input manual abaixo).

on:
  push:
    branches: [main]
    tags:
      - "alpha-*"
      - "beta-*"
      - "rc-*"
      - "v*"
  workflow_dispatch:
    inputs:
      server_url:
        description: "Servidor do Faz o L embutido no app (ex.: https://live.seudominio.com)"
        required: false

permissions:
  contents: write

# A versão seguinte só é calculada depois que a publicação anterior termina.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Instalar CLI do Tauri
        working-directory: desktop
        run: npm ci

      - name: Testar versionamento
        run: node --test .github/scripts/desktop-version.test.mjs

      - name: Resolver versão e tag
        id: release
        run: node .github/scripts/desktop-version.mjs

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $signed = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)
          if ("${{ steps.release.outputs.release }}" -eq "true" -and -not $signed) {
            throw "Release automática exige TAURI_SIGNING_PRIVATE_KEY para gerar a assinatura e latest.json."
          }
          # Sobrescreve a versão e aponta a atualização pro repositório onde o build roda
          $override = @{
            version = $version
            bundle  = @{ createUpdaterArtifacts = $signed }
            plugins = @{ updater = @{ endpoints = @("https://github.com/${{ github.repository }}/releases/latest/download/latest.json") } }
          }
          $override | ConvertTo-Json -Depth 6 | Set-Content desktop/release.conf.json -Encoding utf8
          Write-Host "versão $version (assinado: $signed)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "signed=$signed" >> $env:GITHUB_OUTPUT

      - name: Gerar instalador
        working-directory: desktop
        env:
          FAZOL_SERVER_URL: ${{ inputs.server_url || vars.FAZOL_SERVER_URL }}
        run: npx tauri build --config release.conf.json

      - name: Preparar arquivos
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $name = "FazOL-$version-setup.exe"
          Copy-Item $setup.FullName "dist/$name"
          if ("${{ steps.version.outputs.signed }}" -eq "True") {
            Copy-Item "$($setup.FullName).sig" "dist/$name.sig"
            # Manifesto lido pelos apps instalados (releases/latest/download/latest.json)
            $manifest = [ordered]@{
              version  = $version
              notes    = "Faz o L $version"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = [ordered]@{
                "windows-x86_64" = [ordered]@{
                  signature = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/$name"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content dist/latest.json -Encoding utf8NoBOM
          }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: faz-o-l-windows
          path: dist/*-setup.exe
          if-no-files-found: error

      - name: Publicar Release
        if: steps.release.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Faz o L ${{ steps.release.outputs.tag }}
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          # Precisa ser a "latest" (não pre-release) pro latest.json ser achado
          prerelease: false
          make_latest: true
