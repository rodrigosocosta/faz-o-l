name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        working-directory: app
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version-file: recorder/go.mod
          cache-dependency-path: recorder/go.sum
      - name: Testar telemetria da API
        working-directory: app
        run: npm test
      - name: Testar e compilar gravador
        working-directory: recorder
        run: |
          go test -race ./...
          go vet ./...
          go build -o /tmp/fazol-recorder-otel .
      - name: Testar trace distribuído Node para Go
        run: node observability/test-integration.mjs /tmp/fazol-recorder-otel
      - name: Checar sintaxe
        working-directory: app
        run: npm run check
      - name: Teste de fumaça (canais, convites, clipes, perfis)
        working-directory: app
        env:
          DB_FILE: /tmp/fazol-test.db
          CLIPS_DIR: /tmp/fazol-clips
          SESSION_SECRET: teste
          LIVEKIT_API_KEY: teste
          LIVEKIT_API_SECRET: teste
          LIVEKIT_HOST: http://127.0.0.1:1
          DISCORD_CLIENT_ID: "1"
          DISCORD_CLIENT_SECRET: "2"
          CREATOR_DISCORD_IDS: "11111"
        run: node smoke.test.mjs
      - name: Checar install.sh
        run: bash -n install.sh && sh -n observability/stack.sh
      - name: Validar docker-compose (Caddy e Traefik)
        run: |
          cp .env.example .env
          COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml:docker-compose.observability.yml docker compose config -q
          COMPOSE_FILE=docker-compose.yml:docker-compose.traefik.yml:docker-compose.observability.yml docker compose config -q
          docker compose -f observability/pours/deployment/compose.yaml config -q
          python3 observability/config.test.py
      - name: Build da imagem
        run: docker build -t faz-o-l ./app
