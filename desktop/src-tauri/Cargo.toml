[package]
name = "faz-o-l-desktop"
version = "0.1.0-alpha"
description = "Faz o L — app desktop para transmitir a tela com captura nativa"
edition = "2021"
license = "MIT"

[lib]
name = "faz_o_l_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
livekit = { version = "0.12", features = ["rustls-tls-native-roots"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0"
wasapi = "0.27"
# Media Foundation: codificação H.264 na placa de vídeo (NVENC / AMF / QuickSync)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

# Menos informação de depuração: o libwebrtc é enorme e enche o disco rápido
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
debug = false

[profile.release.build-override]
debug = false

[profile.release]
debug = false
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
