# Acrescente este arquivo ao COMPOSE_FILE depois do proxy escolhido.
# Primeiro inicie ./observability/stack.sh up para criar a rede de ingestão.
services:
  app:
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: fazol-app
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fazol-otel-collector:4318
      APP_VERSION: ${APP_VERSION:-development}
    networks:
      observability: {}
  recorder:
    environment:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: fazol-recorder
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://fazol-otel-collector:4318
      APP_VERSION: ${APP_VERSION:-development}
    networks:
      observability: {}
  livekit:
    networks:
      observability:
        aliases: [fazol-livekit-metrics]

networks:
  observability:
    external: true
    name: fazol-observability
